[project]
name = "resume-tailor"
version = "0.1.0"
description = "AI-powered resume bullet point optimizer and job description tailor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "google-genai>=1.14.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyopenssl>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
